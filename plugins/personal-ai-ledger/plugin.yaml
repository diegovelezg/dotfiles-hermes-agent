name: personal-ai-ledger
version: "1.0.0"
description: Personal AI ledger provider — exposes ledger, briefing & browser activity tools from Diego's personal-ai MCP v5 server. Shares connection with personal-ai-memory plugin.
provider: personal-ai-ledger
author: Diego Vélez

# This plugin exposes non-memory tools from the same MCP server as personal-ai-memory
# Both plugins use PERSONAL_AI_BASE_URL, PERSONAL_AI_API_KEY, PERSONAL_AI_REMOTE_URL from env

pip_dependencies:
  - httpx

config_fields:
  - key: user_id
    description: Platform user ID for personal-ai (Telegram user ID)
    default: "1093162286"
    required: false
